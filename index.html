<header><h1>🥙 شاورما الناصر<small style="display:block;font-size:12px;font-weight:400;opacity:.85">برنامج إدارة المطعم — المخزون · الهدر · الأرباح</small></h1><div class="hb np"><button onclick="backup()">💾 نسخة احتياطية</button><button onclick="$('#imp').click()">📂 استعادة</button><input type="file" id="imp" accept=".json" hidden onchange="restore(this)"></div><div class="per np">من <input type="date" id="f" onchange="setP()"> إلى <input type="date" id="t" onchange="setP()"></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const KEY='rest_v1',T=[['day','📝 الإدخال اليومي'],['mat','📦 المواد والجرد'],['rec','🍔 الوجبات'],['sup','🤝 الموردين'],['sal','👥 الرواتب'],['home','📊 الملخص'],['rep','🖨️ التقرير']];
const UN={kg:['كيلو','غرام',1000],l:['لتر','مل',1000],pc:['حبة','حبة',1]};
const uid=()=>Math.random().toString(36).slice(2,9);
let S,tab='day',day=new Date().toISOString().slice(0,10);
const nm=['دجاج شاورما','دجاج بروستد','برغر لحمة','بطاطا','مايونيز','خبز شراك صغير','خبز برغر','زيت صويا','كاتشاب','مخلل مشكل'];
const rn=['شاورما','ساندويش عادي / مكس','ساندويش سوبر','ساندويش فرنسي','وجبة عادي','وجبة سوبر','وجبة دبل','وجبة تربل','توفير','عائلي شاورما','الاصحاب','العائلي','عرض 10','كامل'];
function def(){const d=new Date(),a=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);
return{from:a,to:d.toISOString().slice(0,10),mats:nm.map((n,i)=>({id:uid(),name:n,u:i==5||i==6?'pc':'kg',price:0,op:0,cl:0})),recs:rn.map(n=>({id:uid(),name:n,price:0,ing:[]})),sales:{},buys:[],exp:[],sal:[]}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=def();
const pk=()=>S.from+'|'+S.to;
if(!S.stock){S.stock={};const o={};S.mats.forEach(m=>{if(m.op||m.cl)o[m.id]={op:m.op,cl:m.cl}});S.stock[pk()]=o}
function st(id){const cur=(S.stock[pk()]||{})[id]||{};let op=cur.op,auto=false,best=null;
if(op===undefined){Object.keys(S.stock).forEach(k=>{const b=k.split('|')[1];if(b<S.from&&(S.stock[k][id]||{}).cl!==undefined&&(!best||b>best.split('|')[1]))best=k});if(best){op=S.stock[best][id].cl;auto=true}}
return{op:n0(op),cl:n0(cur.cl),auto}}
function SetSt(id,p,v){const k=pk();S.stock[k]=S.stock[k]||{};S.stock[k][id]=S.stock[k][id]||{};S.stock[k][id][p]=v===''?undefined:+v;save();R()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),n0=x=>(+x||0),f=x=>n0(x).toLocaleString('en',{maximumFractionDigits:2}),M=id=>S.mats.find(m=>m.id==id);
const inP=d=>d>=S.from&&d<=S.to;
function setP(){const a=$('#f').value,b=$('#t').value;if(!a||!b)return;if(a>b){alert('تاريخ البداية بعد النهاية');R();return}S.from=a;S.to=b;save();R()}
function calc(){
const use={},sold={},dayRev={},dayQty={};let rev=0;
S.mats.forEach(m=>use[m.id]={th:0,buy:0,buyC:0});
Object.entries(S.sales).forEach(([d,o])=>{if(!inP(d))return;Object.entries(o).forEach(([rid,q])=>{q=n0(q);const r=S.recs.find(x=>x.id==rid);if(!r||!q)return;
sold[rid]=(sold[rid]||0)+q;const v=q*n0(r.price);rev+=v;dayRev[d]=(dayRev[d]||0)+v;dayQty[d]=(dayQty[d]||0)+q;
r.ing.forEach(g=>{const m=M(g.mid);if(m)use[m.id].th+=q*n0(g.q)/UN[m.u][2]})})});
let buyT=0;S.buys.forEach(b=>{if(!inP(b.d)||!use[b.mid])return;use[b.mid].buy+=n0(b.q);use[b.mid].buyC+=n0(b.c);buyT+=n0(b.c)});
let opV=0,clV=0;const rows=S.mats.map(m=>{const u=use[m.id];const t=st(m.id);u.st=t;u.act=t.op+u.buy-t.cl;u.waste=u.act-u.th;u.wv=u.waste*n0(m.price);u.av=u.act*n0(m.price);
opV+=t.op*n0(m.price);clV+=t.cl*n0(m.price);return{m,...u}});
const cogs=opV+buyT-clV;
let days=Math.max(1,Math.round((new Date(S.to)-new Date(S.from))/864e5)+1);
const fixed=S.exp.filter(e=>inP(e.d)).reduce((a,e)=>a+n0(e.a),0);
const sal=S.sal.reduce((a,e)=>a+n0(e.a),0)*days/30;
const net=rev-cogs-fixed-sal,cr=rev?cogs/rev:0,be=cr<1?(fixed+sal)/(1-cr):0;
const bd=Object.entries(dayRev).sort((a,b)=>b[1]-a[1])[0];
return{rows,use,sold,rev,cogs,fixed,sal,net,cr,be,days,bd,opV,clV,buyT,dayRev}}
function topBy(a,k){return a.slice().sort((x,y)=>y[k]-x[k])[0]}
function chart(c){const mx=Math.max(c.be*1.5,c.rev*1.2,1),W=320,H=180,X=v=>20+v/mx*(W-30),Y=v=>H-15-v/(mx)*(H-25),fc=c.fixed+c.sal;
return`<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="20" y1="${H-15}" x2="${W-10}" y2="${H-15}" stroke="var(--m)"/><line x1="20" y1="10" x2="20" y2="${H-15}" stroke="var(--m)"/>
<line x1="${X(0)}" y1="${Y(0)}" x2="${X(mx)}" y2="${Y(mx)}" stroke="var(--g)" stroke-width="2"/>
<line x1="${X(0)}" y1="${Y(fc)}" x2="${X(mx)}" y2="${Y(fc+mx*c.cr)}" stroke="var(--r)" stroke-width="2"/>
${c.be?`<circle cx="${X(c.be)}" cy="${Y(c.be)}" r="5" fill="var(--p)"/><text x="${X(c.be)}" y="${Y(c.be)-9}" font-size="10" fill="var(--t)" text-anchor="middle">${f(c.be)}</text>`:''}
<text x="${W-12}" y="14" font-size="10" fill="var(--g)" text-anchor="end">الإيرادات</text><text x="${W-12}" y="26" font-size="10" fill="var(--r)" text-anchor="end">التكاليف</text></svg>`}
const K=(a,b,c)=>`<div><small>${a}</small><b class="${c||''}">${b}</b></div>`;
function summary(c,full){const um=topBy(c.rows,'act'),wm=topBy(c.rows,'wv'),ti=Object.entries(c.sold).sort((a,b)=>b[1]-a[1])[0];
const rn=id=>(S.recs.find(r=>r.id==id)||{}).name;
return`<div class="card"><h2>الفترة: ${S.from} → ${S.to} (${c.days} يوم)</h2><div class="k">${K('المبيعات',f(c.rev))}${K('تكلفة البضاعة المباعة',f(c.cogs))}${K('نسبة التكلفة',f(c.cr*100)+'%')}${K('مصاريف ثابتة',f(c.fixed))}${K('الرواتب',f(c.sal))}${K('صافي الربح',f(c.net),c.net>=0?'pos':'neg')}${K('نقطة التعادل (مبيعات)',f(c.be))}${K('المتبقي للوصول للتعادل',c.rev>=c.be?'تجاوزت التعادل ✅':f(c.be-c.rev),c.rev>=c.be?'pos':'neg')}${K('التعادل اليومي',f(c.be/c.days))}${K('أعلى يوم مبيعات',c.bd?c.bd[0]+' ('+f(c.bd[1])+')':'-')}${K('أكثر صنف مبيعاً',ti?rn(ti[0])+' ('+ti[1]+')':'-')}${K('أكثر مادة استخداماً',um&&um.act>0?um.m.name:'-')}${K('أكثر مادة هدراً',wm&&wm.wv>0?wm.m.name+' ('+f(wm.wv)+')':'-')}</div></div>
<div class="card"><h2>المبيعات اليومية</h2><div class="bars">${Object.entries(c.dayRev).sort().map(([d,v])=>`<i style="height:${Math.max(4,v/Math.max(...Object.values(c.dayRev))*100)}%" title="${d}: ${f(v)}"><span>${d.slice(8)}</span></i>`).join('')||'<span class=m>لا مبيعات بالفترة</span>'}</div><div style="height:14px"></div></div>
`}
const V={
home(){const c=calc();return summary(c)},
mat(){const c=calc();return`${cntCard()}<div class="card"><h2>➕ إضافة مادة أولية</h2><div class="frm row"><input id="mn" placeholder="اسم المادة"><select id="mu">${Object.entries(UN).map(([k,v])=>`<option value=${k}>${v[0]}</option>`).join('')}</select><input id="mp" type="number" step="any" placeholder="سعر الوحدة"><button class="b" onclick="NewMat()">حفظ المادة</button></div></div><div class="card"><h2>المواد الأولية (بضاعة أول وآخر المدة بوحدة الشراء)</h2><div class="row"><input placeholder="🔎 بحث عن مادة" value="${ms}" onchange="ms=this.value;R()"></div><div class="w"><table><tr><th>المادة</th><th>الوحدة</th><th>سعر الوحدة</th><th>أول المدة</th><th>آخر المدة</th><th>مشتريات</th><th>مستخدم فعلي</th><th>نظري</th><th>هدر</th><th>قيمة الهدر</th><th></th></tr>
${c.rows.filter(r=>r.m.name.includes(ms)).map(r=>`<tr><td><input value="${r.m.name}" onchange="U('mats','${r.m.id}','name',this.value)"></td><td><select onchange="U('mats','${r.m.id}','u',this.value)">${Object.entries(UN).map(([k,v])=>`<option value=${k} ${r.m.u==k?'selected':''}>${v[0]}</option>`).join('')}</select></td>
<td><input type="number" step="any" value="${r.m.price}" onchange="U('mats','${r.m.id}','price',this.value)"></td><td>${f(r.st.op)}<div class="m">${r.st.opd||'—'}</div></td><td>${f(r.st.cl)}<div class="m">${r.st.cld||'—'}</div></td>
<td>${f(r.buy)}</td><td>${f(r.act)}</td><td>${f(r.th)}</td><td class="${r.waste>0.001?'neg':''}">${f(r.waste)}</td><td class="${r.wv>0.001?'neg':''}">${f(r.wv)}</td><td><button class="d" onclick="Del('mats','${r.m.id}')">✕</button></td></tr>`).join('')}</table></div>

<p class="m">📅 أول وآخر المدة بيتاخدوا من سجل الجرد أعلاه حسب تاريخ الفترة. </p><p class="m">سعر الوحدة = سعر الكيلو/اللتر/الحبة. الهدر = المستخدم الفعلي − النظري (من مبيعات الوجبات ومكوناتها).</p></div>`},
rec(){return`<div class="card"><h2>➕ إضافة وجبة</h2><div class="frm row"><input id="rnm" placeholder="اسم الوجبة"><input id="rpr" type="number" step="any" placeholder="سعر البيع"><button class="b" onclick="NewRec()">حفظ الوجبة</button></div></div><div class="card"><h2>الوجبات ومكوناتها (الكمية بالغرام/مل/حبة)</h2>${recFilter()}${recList().map(r=>{const cost=r.ing.reduce((a,g)=>{const m=M(g.mid);return a+(m?n0(g.q)/UN[m.u][2]*n0(m.price):0)},0);
return`<div class="card"><div class="row"><input value="${r.name}" onchange="U('recs','${r.id}','name',this.value)"> سعر البيع <input type="number" step="any" value="${r.price}" onchange="U('recs','${r.id}','price',this.value)"><button class="d" onclick="Del('recs','${r.id}')">✕</button></div>
${r.ing.map((g,i)=>{const m=M(g.mid);return`<div class="row"><select onchange="G('${r.id}',${i},'mid',this.value)">${S.mats.map(x=>`<option value="${x.id}" ${x.id==g.mid?'selected':''}>${x.name}</option>`).join('')}</select><input type="number" step="any" value="${g.q}" onchange="G('${r.id}',${i},'q',this.value)"> ${m?UN[m.u][1]:''}<button class="d" onclick="G('${r.id}',${i},'x')">✕</button></div>`}).join('')}
<div class="row frm"><select id="gm${r.id}">${S.mats.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><input id="gq${r.id}" type="number" step="any" placeholder="الكمية"><button class="b" onclick="NewIng('${r.id}')">+ إضافة مكوّن</button></div> <span class="m">التكلفة: ${f(cost)} | الربح: ${f(n0(r.price)-cost)}</span></div>`}).join('')}
</div>`},
day(){const o=S.sales[day]||{};const tb=S.buys.filter(b=>b.d==day),te=S.exp.filter(e=>e.d==day);
return`<div class="card"><div class="row"><b>التاريخ:</b><input type="date" value="${day}" onchange="day=this.value;R()"></div></div>
${salesGrid(o)}
<div class="card"><h2>المشتريات</h2>${tb.map(b=>`<div class="row"><span>${(M(b.mid)||{}).name} — كمية ${b.q} — ${f(b.c)}</span><button class="d" onclick="Del('buys','${b.id}')">✕</button></div>`).join('')}
<div class="row"><select id="bm">${S.mats.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><input id="bq" type="number" step="any" placeholder="الكمية"><input id="bc" type="number" step="any" placeholder="التكلفة"><button class="b" onclick="AddBuy()">+ إضافة</button></div></div>
<div class="card"><h2>المصاريف الثابتة/التشغيلية</h2>${te.map(e=>`<div class="row"><span>${e.n} — ${f(e.a)}</span><button class="d" onclick="Del('exp','${e.id}')">✕</button></div>`).join('')}
<div class="row"><input id="en" placeholder="البند (إيجار، كهرباء...)"><input id="ea" type="number" step="any" placeholder="المبلغ"><button class="b" onclick="AddExp()">+ إضافة</button></div></div>`},
sal(){const c=calc();return`<div class="card"><h2>الرواتب (شهرية، تُحتسب حسب أيام الفترة)</h2>${S.sal.map(s=>`<div class="row"><input value="${s.n}" onchange="U('sal','${s.id}','n',this.value)"><input type="number" value="${s.a}" onchange="U('sal','${s.id}','a',this.value)"><button class="d" onclick="Del('sal','${s.id}')">✕</button></div>`).join('')}
<button class="b" onclick="Add('sal',{n:'موظف',a:0})">+ موظف</button><p>إجمالي الرواتب للفترة: <b>${f(c.sal)}</b></p></div>`},
